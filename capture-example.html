<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quilta Capture · 合成示例</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#25392e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 64px;border-bottom:1px solid #d8ddd2;font-size:13px;letter-spacing:2px}
.hero{padding:44px 64px 32px}.hero p{color:#697567;font-size:14px}.hero h1{margin:10px 0;font-size:44px;font-weight:500;letter-spacing:2px}
main{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:0 64px 64px}
article{overflow:hidden;padding:12px;box-shadow:inset 0 0 0 1px #d4dacd;border-radius:20px;background:#fffdf7}
.visual{height:216px;background:#d9e4d7;position:relative;overflow:hidden}
.arch{position:absolute;width:170px;height:190px;left:56px;top:44px;border-radius:90px 90px 0 0;background:#68826c}
.arch:after{content:"";position:absolute;width:104px;height:160px;left:34px;top:44px;border-radius:58px 58px 0 0;background:#d9e4d7}
.block{position:absolute;width:168px;height:100px;right:34px;bottom:0;background:#e4b399}
.copy{padding:24px 28px}h2{margin:0 0 10px;font-size:24px;font-weight:500}p{line-height:1.7;margin:0 0 16px;color:#667466;font-size:14px}
button,a.demo-link{display:inline-block;border:0;padding:10px 18px;background:#2c4b38;color:white;border-radius:999px;text-decoration:none;font-size:13px}
.palette{display:flex;height:216px}.palette div{flex:1}.palette div:nth-child(1){background:#e4b399}.palette div:nth-child(2){background:#d9e4d7}.palette div:nth-child(3){background:#b5c4ce}.palette div:nth-child(4){background:#f0dfb0}
.motion{background:#eadbd0;display:grid;place-items:center}.orbit{width:116px;height:116px;border-radius:36px;background:#b56750;animation:turn 5s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}.wide{grid-column:1/-1}
#page-end{padding:40px 28px;background:#e5ecdf;grid-column:1/-1}
#synthetic-page-scroll-root{position:absolute;inset:0;overflow:auto;background:#f5f2e9}
body.fixed-body-mode{position:fixed;inset:0;height:100vh;overflow:hidden}
</style></head><body>
<header><span>QUILTA · CAPTURE EXAMPLE</span><span>合成素材 · 无外部资源</span></header>
<section class="hero"><p>COLLECT WHAT CATCHES YOUR EYE</p><h1>把看见的灵感，留在画布里。</h1></section>
<main>
<article id="static-component" aria-label="安静建筑静态组件"><div class="visual"><div class="arch"></div><div class="block"></div></div><div class="copy"><h2>安静建筑</h2><p>用几何、色彩与留白，记录一段视觉灵感。</p><button type="button">查看方案</button></div></article>
<article id="linked-component" aria-label="材料索引"><div class="palette"><div></div><div></div><div></div><div></div></div><div class="copy"><h2>材料与色彩</h2><p>选择这个组件，保留视觉、文字与来源。</p><a class="demo-link" href="#motion-component">查看动效示例</a></div></article>
<article id="motion-component" class="wide" aria-label="旋转动效示例"><div class="visual motion"><div class="orbit"></div></div><div class="copy"><h2>缓慢转动的一块拼布</h2><p>录制动效示例：没有声音、摄像头或麦克风。主动录制，完成后预览并收藏。</p></div></article>
<section id="page-end"><h2>页面后段 · 完整收藏检查</h2><p>整页截图应包含此处；整页动效回看也应能找到这段内容。</p></section>
</main>
<script>
if(new URLSearchParams(location.search).has('fixed-body')){
document.body.classList.add('fixed-body-mode');
const root=document.createElement('div');root.id='synthetic-page-scroll-root';
for(const child of [...document.body.children])if(child.tagName!=='SCRIPT')root.append(child);
document.body.prepend(root);
}
</script>
</body></html>
